name: Release

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    name: Lint, build and Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer
          coverage: none

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          composer install --no-interaction --prefer-dist

      - name: Lint PHP
        run: composer lint

      - name: Lint JavaScript and styles
        run: |
          pnpm lint:js
          pnpm lint:css

      - name: Build blocks
        run: pnpm build

      # Check what actually ships: the tree minus everything in .distignore.
      - name: Assemble distribution
        run: |
          mkdir -p dist/superquest
          rsync -a --exclude-from=.distignore --exclude=dist ./ dist/superquest/

      - name: Plugin Check
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: dist/superquest

  release:
    name: Bump version
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      is_bumped: ${{ steps.foonver.outputs.is_bumped }}
      version: ${{ steps.foonver.outputs.version }}
      release_notes: ${{ steps.foonver.outputs.release_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run foonver
        id: foonver
        uses: foonly/foonver@v1.0.0
        with:
          command: "auto"
          changelog: "true"
          changelog_format: "wordpress"
          changelog_file: "readme.txt"
          changelog_start: "== Changelog =="
          version_sync: "superquest.php,readme.txt,src/quest/block.json"
          push: "true"
          commit_suffix: "[skip ci]"

  deploy:
    name: Deploy and publish
    needs: release
    if: needs.release.outputs.is_bumped == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build blocks
        run: pnpm build

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: superquest
          ASSETS_DIR: .wordpress-org
          VERSION: ${{ needs.release.outputs.version }}

      - name: Build plugin ZIP
        run: |
          mkdir -p dist/superquest
          rsync -a --exclude-from=.distignore --exclude=dist ./ dist/superquest/
          cd dist && zip -r ../superquest.zip superquest/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          body: ${{ needs.release.outputs.release_notes }}
          files: superquest.zip
